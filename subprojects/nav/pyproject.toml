[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nav"
version = "0.1.0"
description = "Daily net asset value tracking for a 미래에셋증권 account"
requires-python = ">=3.9"
dependencies = [
    "click>=8.0,<9.0",
    "pandas>=2.0.0",
    "pyarrow>=10.0",
    "PyYAML>=6.0,<6.1",
    "rich>=13.6,<14.0",
]

[project.scripts]
nav = "nav.cli:cli"

[tool.setuptools.packages.find]
include = ["nav*"]
